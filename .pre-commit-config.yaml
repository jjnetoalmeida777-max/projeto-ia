repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff
        language: system
        types: [python]
        args: [check]

      - id: ruff-format
        name: ruff format check
        entry: ruff
        language: system
        types: [python]
        args: [format, --check]

      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
