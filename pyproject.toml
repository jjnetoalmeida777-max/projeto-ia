[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-ia"
version = "0.1.0"
description = "Projeto de IA privado e pessoal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv==1.2.4",
    "openai-agents==0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.10",
]
